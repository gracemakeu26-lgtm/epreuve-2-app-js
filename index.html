<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Lumière — Suivi des dépenses fournitures</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, sans-serif; background: #F9F7F4; color: #1A1A1A; padding: 40px 16px; }
    .app { max-width: 520px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 28px; box-shadow: 0 6px 20px rgba(107,44,57,.10); }
    h1 { font-size: 1.4rem; margin-bottom: 4px; color: #6B2C39; }
    .budget-info { color: #5C5C5C; margin-bottom: 20px; }
    .budget-info strong { color: #6B2C39; }
    form { display: flex; gap: 8px; margin-bottom: 8px; }
    input { padding: 10px 12px; border: 1px solid #E8E0D8; border-radius: 8px; font-size: 1rem; }
    #libelle { flex: 1; }
    #montant { width: 110px; }
    button[type="submit"] { background: #6B2C39; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 1rem; cursor: pointer; }
    button[type="submit"]:hover { background: #5A2430; }
    .erreur { color: #C0392B; font-size: .9rem; min-height: 1.2em; margin-bottom: 12px; }
    ul { list-style: none; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; border-bottom: 1px solid #F5F2ED; }
    li .montant { font-weight: 600; margin-left: auto; margin-right: 12px; }
    li button { background: none; border: none; color: #C0392B; cursor: pointer; font-size: 1rem; }
    .total-ligne { display: flex; justify-content: space-between; margin-top: 16px; font-weight: 700; font-size: 1.1rem; }
    .depasse { color: #C0392B; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Suivi des dépenses — Studio Lumière</h1>
    <p class="budget-info">Budget mensuel fournitures : <strong>500 €</strong></p>

    <form id="formulaire">
      <input type="text" id="libelle" placeholder="Libellé (ex : Vernis à ongles)">
      <input type="number" id="montant" placeholder="Montant" step="0.01">
      <button type="submit">Ajouter</button>
    </form>
    <p class="erreur" id="erreur"></p>

    <ul id="liste"></ul>

    <div class="total-ligne">
      <span>Total dépensé</span>
      <span id="total">0 €</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
